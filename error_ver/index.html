<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .welcome-box {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #667eea;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        
        button:hover:not(:disabled) {
            background: #5568d3;
        }
        
        button:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .message {
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        .error {
            color: #e74c3c;
        }
        
        .success {
            color: #27ae60;
        }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1>請輸入您的名字</h1>
        <input 
            type="text" 
            id="nameInput" 
            placeholder="您的名字"
            autocomplete="off"
            maxlength="50"
        >
        <button id="enterBtn" onclick="enterSite()">
            進入
            <span id="loading" class="loading" style="display: none;"></span>
        </button>
        <div class="message" id="message"></div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const enterBtn = document.getElementById('enterBtn');
        const message = document.getElementById('message');
        const loading = document.getElementById('loading');
        
        // 按 Enter 也能提交
        nameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enterSite();
            }
        });
        
        // 輸入時隱藏訊息
        nameInput.addEventListener('input', function() {
            message.style.display = 'none';
        });
        
        async function enterSite() {
            const name = nameInput.value.trim();
            
            if (name === '') {
                showMessage('請輸入您的名字', 'error');
                nameInput.focus();
                return;
            }
            
            // 顯示載入狀態
            enterBtn.disabled = true;
            loading.style.display = 'inline-block';
            message.style.display = 'none';
            
            try {
                // 發送名字到後端
                const response = await fetch('http://localhost:8000/api/save-name', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: name })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 儲存名字到 sessionStorage
                    sessionStorage.setItem('userName', name);
                    
                    // 顯示成功訊息
                    showMessage('檔案已建立，正在跳轉...', 'success');
                    
                    // 1秒後跳轉到主頁面
                    setTimeout(() => {
                        window.location.href = 'main.html';
                    }, 1000);
                } else {
                    showMessage(data.message || '發生錯誤', 'error');
                    enterBtn.disabled = false;
                    loading.style.display = 'none';
                }
            } catch (error) {
                showMessage('無法連接到伺服器，請確認伺服器是否運行', 'error');
                enterBtn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
