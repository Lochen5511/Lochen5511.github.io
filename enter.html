<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>進入系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --cream: #f5f0e8;
      --dark: #1a1612;
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --glass-bg: rgba(245, 240, 232, 0.08);
      --glass-border: rgba(201, 168, 76, 0.25);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1a1612;
    }

    /* ── 背景圖層 ── */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url("C:\\Users\\Procidens_Pulvis\\Desktop\\TxT\\website_AI\\Lochen5511.github.io\\20251205_124326.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.45) saturate(0.8);
      z-index: 0;
      transform: scale(1.04);
      transition: filter 1.2s ease;
    }

    /* 細緻暗角 */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 40%,
        rgba(10, 8, 6, 0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── 對話框容器 ── */
    .dialog-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      opacity: 0;
      transform: translateY(28px);
      animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    /* 頂部裝飾線 */
    .deco-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .deco-top .line {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .deco-top .line.right {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .deco-top .diamond {
      width: 6px; height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.85;
    }

    /* 主對話框 */
    .dialog {
      width: 420px;
      padding: 52px 48px 44px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 24px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(201,168,76,0.06);
      position: relative;
      overflow: hidden;
    }

    /* 左上角光暈 */
    .dialog::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .dialog-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .dialog-heading {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px;
      font-weight: 300;
      color: var(--cream);
      text-align: center;
      letter-spacing: 0.08em;
      margin-bottom: 36px;
      line-height: 1.4;
    }

    /* Input 欄位 */
    .input-group {
      position: relative;
      margin-bottom: 28px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--gold-light);
      opacity: 0.7;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: none;
      border-bottom: 1px solid rgba(201,168,76,0.35);
      padding: 12px 4px;
      font-family: 'Noto Serif TC', serif;
      font-size: 17px;
      font-weight: 300;
      color: var(--cream);
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.3s ease, background 0.3s ease;
      caret-color: var(--gold);
    }

    .input-group input::placeholder {
      color: rgba(245,240,232,0.25);
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
    }

    .input-group input:focus {
      border-bottom-color: var(--gold);
      background: rgba(201,168,76,0.04);
    }

    /* 底部滑動線 */
    .input-group .underline {
      position: absolute;
      bottom: 0; left: 0;
      width: 0%; height: 1px;
      background: var(--gold);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .input-group input:focus ~ .underline {
      width: 100%;
    }

    /* 進入按鈕 */
    .btn-enter {
      width: 100%;
      padding: 15px;
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--gold-light);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.35s ease, border-color 0.35s ease;
    }

    .btn-enter::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        rgba(201,168,76,0.15) 0%,
        rgba(201,168,76,0.05) 100%);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-enter:hover {
      color: var(--cream);
      border-color: rgba(201,168,76,0.6);
    }
    .btn-enter:hover::before {
      transform: translateX(0);
    }

    .btn-enter:active {
      transform: scale(0.98);
    }

    /* 底部提示文字 */
    .dialog-footer {
      margin-top: 24px;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: rgba(245,240,232,0.28);
    }

    /* 底部裝飾 */
    .deco-bottom {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
    }
    .deco-bottom .line {
      width: 40px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,0.4));
    }
    .deco-bottom .line.right {
      background: linear-gradient(to left, transparent, rgba(201,168,76,0.4));
    }
    .deco-bottom .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
    }

    /* 動畫 */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 錯誤提示 */
    .error-msg {
      font-size: 11px;
      color: #e8a87c;
      letter-spacing: 0.15em;
      text-align: center;
      margin-top: 12px;
      height: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .error-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="vignette"></div>

  <div class="dialog-wrapper">

    <div class="deco-top">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line right"></div>
    </div>

    <div class="dialog">
      <p class="dialog-title">Welcome</p>
      <h1 class="dialog-heading">請輸入您的名字<br>以進入系統</h1>

      <div class="input-group">
        <label>Your Name</label>
        <input
          type="text"
          id="nameInput"
          placeholder="輸入名字…"
          autocomplete="off"
          maxlength="30"
        />
        <div class="underline"></div>
      </div>

      <button class="btn-enter" onclick="handleEnter()">
        進&ensp;入
      </button>

      <p class="error-msg" id="errorMsg">請輸入您的名字才能繼續</p>

      <p class="dialog-footer">此系統僅供授權使用者存取</p>
    </div>

    <div class="deco-bottom">
      <div class="line"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="line right"></div>
    </div>

  </div>

  <script>
    const input = document.getElementById('nameInput');
    const errorMsg = document.getElementById('errorMsg');

    // Enter 鍵也可觸發
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleEnter();
    });

    function handleEnter() {
      const name = input.value.trim();
      if (!name) {
        errorMsg.classList.add('show');
        input.focus();
        // 輕微震動效果
        input.style.animation = 'none';
        input.style.borderBottomColor = '#e8a87c';
        setTimeout(() => {
          input.style.borderBottomColor = '';
        }, 800);
        return;
      }
      errorMsg.classList.remove('show');

      // 儲存名字並跳轉（可改為你的下一頁路徑）
      sessionStorage.setItem('userName', name);
      console.log('進入系統，使用者：', name);

      // TODO: 改成你的下一頁，例如：
      // window.location.href = 'main.html';
      alert(`歡迎，${name}！`);
    }
  </script>

</body>
</html>
