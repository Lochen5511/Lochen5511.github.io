<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>進入系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream:        #f5f0e8;
      --gold:         #c9a84c;
      --gold-light:   #e8d5a3;
      --glass-bg:     rgba(26, 22, 18, 0.97);
      --glass-border: rgba(201, 168, 76, 0.35);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Noto Serif TC', serif;
      background: #1a1612;
    }

    .bg {
      position: fixed; inset: 0;
      background-image: url('./20251205_124326.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.45) saturate(0.8);
      z-index: 0;
      transform: scale(1.04);
    }

    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(10,8,6,0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .wrapper {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 20px;
      opacity: 0; transform: translateY(24px);
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .deco {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .deco .line {
      width: 50px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .deco .line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .deco .diamond {
      width: 6px; height: 6px;
      background: var(--gold); transform: rotate(45deg); opacity: 0.85;
    }

    .dialog {
      width: min(420px, 100%);
      padding: 48px 44px 40px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      position: relative; overflow: hidden;
    }
    .dialog::before {
      content: '';
      position: absolute; top: -60px; left: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .dialog-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; letter-spacing: 0.35em;
      text-transform: uppercase; color: var(--gold);
      text-align: center; margin-bottom: 10px; opacity: 0.9;
    }

    .dialog-title {
      font-size: 24px; font-weight: 300;
      color: var(--cream); text-align: center;
      letter-spacing: 0.08em; margin-bottom: 32px;
      line-height: 1.5;
    }

    .field { position: relative; margin-bottom: 24px; }
    .field label {
      display: block; font-size: 10px;
      letter-spacing: 0.3em; color: var(--gold-light);
      opacity: 0.7; margin-bottom: 8px;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: none; border-bottom: 1px solid rgba(201,168,76,0.35);
      padding: 10px 4px;
      font-family: 'Noto Serif TC', serif;
      font-size: 16px; font-weight: 300;
      color: var(--cream); outline: none;
      caret-color: var(--gold);
      transition: border-color 0.3s, background 0.3s;
    }
    .field input::placeholder {
      color: rgba(245,240,232,0.22);
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
    }
    .field input:focus {
      border-bottom-color: var(--gold);
      background: rgba(201,168,76,0.04);
    }
    .field .underline {
      position: absolute; bottom: 0; left: 0;
      width: 0; height: 1px; background: var(--gold);
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .field input:focus ~ .underline { width: 100%; }

    .btn {
      width: 100%; padding: 14px;
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--gold-light);
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.4em;
      text-transform: uppercase; cursor: pointer;
      position: relative; overflow: hidden;
      transition: color 0.3s, border-color 0.3s;
    }
    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.15) 0%, rgba(201,168,76,0.05) 100%);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .btn:hover { color: var(--cream); border-color: rgba(201,168,76,0.6); }
    .btn:hover::before { transform: translateX(0); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; letter-spacing: 0.15em;
      text-align: center; min-height: 18px;
      color: #e8a87c; opacity: 0;
      transition: opacity 0.3s;
    }
    .status.show { opacity: 1; }
    .status.info { color: var(--gold-light); }

    .footer {
      margin-top: 20px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 0.2em;
      color: rgba(245,240,232,0.25); text-align: center;
    }

    .deco-bottom {
      display: flex; align-items: center; gap: 12px;
      margin-top: 24px;
    }
    .deco-bottom .line {
      width: 36px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,0.35));
    }
    .deco-bottom .line.r {
      background: linear-gradient(to left, transparent, rgba(201,168,76,0.35));
    }
    .deco-bottom .dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--gold); opacity: 0.45;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="vignette"></div>

<div class="wrapper">
  <div class="deco">
    <div class="line"></div>
    <div class="diamond"></div>
    <div class="line r"></div>
  </div>

  <div class="dialog">
    <p class="dialog-label">Welcome</p>
    <h1 class="dialog-title">請輸入您的名字<br>以進入系統</h1>

    <div class="field">
      <label>Your Name</label>
      <input type="text" id="nameInput" placeholder="輸入名字…"
             autocomplete="off" maxlength="30"/>
      <div class="underline"></div>
    </div>

    <button class="btn" id="enterBtn" onclick="handleEnter()">進&ensp;入</button>

    <p class="status" id="status">請輸入您的名字才能繼續</p>
    <p class="footer">此系統僅供授權使用者存取</p>
  </div>

  <div class="deco-bottom">
    <div class="line"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="line r"></div>
  </div>
</div>

<script>
  const BACKEND = 'https://lochen5511.loca.lt';

  const nameInput = document.getElementById('nameInput');
  const enterBtn  = document.getElementById('enterBtn');
  const statusEl  = document.getElementById('status');

  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleEnter();
  });

  function showStatus(msg, isInfo = false) {
    statusEl.textContent = msg;
    statusEl.className   = 'status show' + (isInfo ? ' info' : '');
  }

  function hideStatus() {
    statusEl.className = 'status';
  }

  async function handleEnter() {
    const name = nameInput.value.trim();

    if (!name) {
      showStatus('請輸入您的名字才能繼續');
      nameInput.focus();
      return;
    }

    enterBtn.disabled = true;
    showStatus('連線中…', true);

    let sessionId = '';

    try {
      console.log('[enter] 嘗試連線後端...');
      const res = await fetch(`${BACKEND}/enter`, {
        method:  'POST',
        headers: {
          'Content-Type':          'application/json',
          'bypass-tunnel-reminder': 'true',
        },
        body: JSON.stringify({ username: name }),
      });

      console.log('[enter] 回應狀態:', res.status, res.headers.get('content-type'));

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error('非 JSON 回應：' + contentType);
      }

      const data = await res.json();
      console.log('[enter] 回應資料:', data);

      if (data.session_id) {
        sessionId = data.session_id;
        console.log('[enter] session_id:', sessionId);
      } else {
        throw new Error('無 session_id');
      }

    } catch (e) {
      console.warn('[enter 失敗]', e.message);
      // 後端無回應時用本地時間戳作為備用（格式與後端一致）
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      sessionId = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    }

    // 跳轉，把 username 和 session_id 帶進 URL
    window.location.href =
      `main.html?username=${encodeURIComponent(name)}&session_id=${encodeURIComponent(sessionId)}`;
  }
</script>

</body>
</html>
