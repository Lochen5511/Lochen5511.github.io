<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI 共學</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #13110e;
      --surface:  #1c1814;
      --surface2: #242018;
      --border:   rgba(201,168,76,0.55);
      --gold:     #c9a84c;
      --gold-dim: rgba(201,168,76,0.75);
      --cream:    #f8f4ec;
      --muted:    rgba(248,244,236,0.6);
      --user-bg:  #2a2318;
      --ai-bg:    #1c1814;
      --radius:   14px;
      --panel-w:  340px;
    }

    html, body {
      height: 100%;
      background: var(--surface);
      font-family: 'Noto Serif TC', serif;
      color: var(--cream);
      overflow: hidden;
    }

    /* ── Layout ── */
    .app {
      display: flex; flex-direction: column;
      height: 100vh;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0; gap: 14px;
      position: relative;
    }
    .hd { display: flex; align-items: center; gap: 8px; }
    .hd .line {
      width: 32px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }
    .hd.r .line { background: linear-gradient(to left, transparent, var(--gold-dim)); }
    .hd .diamond {
      width: 5px; height: 5px;
      background: var(--gold); transform: rotate(45deg); opacity: 0.7;
    }
    header h1 {
      font-size: 19px; font-weight: 400; letter-spacing: 0.25em; color: var(--cream);
    }
    header h1 span { color: var(--gold); }
    .user-badge {
      position: absolute; right: 20px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.1em; color: var(--muted);
    }
    .user-badge strong { color: var(--gold-dim); font-weight: 400; }

    /* ── Messages ── */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 24px 20px;
      display: flex; flex-direction: column; gap: 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(201,168,76,0.15) transparent;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(201,168,76,0.15); border-radius: 2px;
    }

    /* Empty state */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
    }
    .empty .icon {
      width: 44px; height: 44px;
      border: 1px solid var(--border); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--gold-dim);
    }
    .empty p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px; letter-spacing: 0.15em; color: var(--muted);
    }

    /* ── Message row ── */
    .msg {
      display: flex; gap: 10px;
      align-items: flex-start; width: 100%;
      opacity: 0; transform: translateY(8px);
      animation: msgIn 0.3s ease forwards;
    }
    .msg.user { flex-direction: row-reverse; }

    .avatar-col {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px; flex-shrink: 0;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-family: 'Noto Serif TC', serif;
    }
    .msg.ai   .avatar { background: var(--surface2); color: var(--gold); }
    .msg.user .avatar { background: var(--user-bg);  color: var(--cream); }
    .avatar-name {
      font-size: 10px; color: var(--muted);
      letter-spacing: 0.08em; text-align: center;
      max-width: 48px; word-break: break-all; line-height: 1.3;
    }

    .msg-body {
      display: flex; flex-direction: column;
      flex: 1; min-width: 0;
    }
    .msg.user .msg-body { align-items: flex-end; }

    .bubble {
      padding: 12px 16px; border-radius: var(--radius);
      font-size: 15px; font-weight: 300; line-height: 1.7;
      letter-spacing: 0.02em;
      word-break: break-word; white-space: pre-wrap; overflow-wrap: anywhere;
      width: fit-content; max-width: 100%;
    }
    .bubble.html-bubble {
      white-space: normal;
      width: 100%;
    }
    .msg.ai   .bubble {
      background: var(--ai-bg); border: 1px solid var(--border);
      border-top-left-radius: 4px; color: var(--cream);
    }
    .msg.user .bubble {
      background: var(--user-bg); border: 1px solid rgba(201,168,76,0.22);
      border-top-right-radius: 4px; color: var(--cream);
    }

    .msg-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; color: var(--muted);
      margin-top: 4px; opacity: 0.65; letter-spacing: 0.08em;
    }
    .msg.user .msg-time { text-align: right; }

    /* ── Dropdown ── */
    .msg-dropdown {
      margin-top: 6px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .msg-dropdown select {
      background: var(--surface2);
      border: 1px solid var(--gold);
      border-radius: 8px;
      color: var(--cream);
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      padding: 8px 12px;
      cursor: pointer;
      outline: none;
      min-width: 200px;
      transition: border-color 0.2s;
    }
    .msg-dropdown select:focus { border-color: var(--gold-dim); }
    .msg-dropdown select option { background: var(--surface2); }
    .msg-dropdown select:disabled { opacity: 0.4; cursor: default; }
    .msg-dropdown .dd-confirm {
      padding: 8px 20px; border-radius: 8px;
      border: 1px solid var(--gold); background: transparent;
      color: var(--gold); font-family: 'Noto Serif TC', serif;
      font-size: 13px; letter-spacing: 0.1em; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .msg-dropdown .dd-confirm:hover { background: rgba(201,168,76,0.14); color: var(--cream); }
    .msg-dropdown .dd-confirm:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 16px;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--gold-dim); border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Buttons ── */
    .btn-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
    }
    .btn-bubble {
      display: inline-block; border-radius: 8px;
      background: var(--surface); font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.12em; cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      border: 1px solid;
    }
    .btn-bubble:active  { transform: scale(0.97); }
    .btn-bubble.used    { opacity: 0.35; cursor: default; pointer-events: none; }
    .btn-bubble.small   { padding: 6px 14px;  font-size: 12px; }
    .btn-bubble.medium  { padding: 10px 26px; font-size: 14px; }
    .btn-bubble.large   { padding: 13px 38px; font-size: 16px; }
    .btn-bubble.gold    { border-color: var(--gold);  color: var(--gold); }
    .btn-bubble.gold:hover  { background: rgba(201,168,76,0.14); color: var(--cream); }
    .btn-bubble.green   { border-color: #6abf69; color: #6abf69; }
    .btn-bubble.green:hover { background: rgba(106,191,105,0.14); color: #c8f5c7; }
    .btn-bubble.blue    { border-color: #6aaabf; color: #6aaabf; }
    .btn-bubble.blue:hover  { background: rgba(106,170,191,0.14); color: #c7e8f5; }
    .btn-bubble.red     { border-color: #bf6a6a; color: #bf6a6a; }
    .btn-bubble.red:hover   { background: rgba(191,106,106,0.14); color: #f5c7c7; }
    .btn-bubble.gray    { border-color: #777; color: #999; }
    .btn-bubble.gray:hover  { background: rgba(136,136,136,0.14); color: #ddd; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 34px 38px;
      max-width: 400px; width: 90%; text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }
    .modal-icon { font-size: 26px; margin-bottom: 12px; }
    .modal-msg {
      font-size: 15px; font-weight: 300; color: var(--cream);
      line-height: 1.8; letter-spacing: 0.04em; margin-bottom: 26px;
    }
    .modal-close {
      padding: 10px 30px;
      border: 1px solid var(--gold); border-radius: 8px;
      background: transparent; color: var(--gold);
      font-family: 'Noto Serif TC', serif;
      font-size: 13px; letter-spacing: 0.2em; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover { background: rgba(201,168,76,0.14); color: var(--cream); }

    /* ── Input area ── */
    .input-area {
      padding: 14px 18px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .input-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 9px 9px 16px;
      transition: border-color 0.3s;
    }
    .input-row:focus-within {
      border-color: rgba(201,168,76,0.45);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
    }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      resize: none; font-family: 'Noto Serif TC', serif;
      font-size: 15px; font-weight: 300; color: var(--cream);
      line-height: 1.6; max-height: 130px; min-height: 24px;
      caret-color: var(--gold); scrollbar-width: none;
    }
    textarea::placeholder {
      color: var(--muted); font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 15px;
    }
    textarea::-webkit-scrollbar { display: none; }
    .btn-send {
      width: 38px; height: 38px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
    }
    .btn-send svg { width: 17px; height: 17px; transition: transform 0.2s; }
    .btn-send.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
    .btn-send.active:hover { background: #d4b460; transform: scale(1.05); }
    .btn-send.active:hover svg { transform: translate(2px,-2px); }
    .btn-send.active:active { transform: scale(0.96); }
    .input-hint {
      display: flex; justify-content: flex-end;
      margin-top: 6px; font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 0.1em; color: var(--muted); opacity: 0.55;
    }

    /* ── Checkbox 多選元件 ── */
    .msg-checkbox { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
    .msg-checkbox .cb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2); cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 14px; font-weight: 300; color: var(--cream);
      user-select: none;
    }
    .msg-checkbox .cb-item:hover { border-color: var(--gold-dim); }
    .msg-checkbox .cb-item.checked {
      border-color: var(--gold); background: rgba(201,168,76,0.1);
    }
    .msg-checkbox .cb-item input[type=checkbox] { display: none; }
    .msg-checkbox .cb-box {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1px solid var(--gold-dim); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--gold); transition: background 0.2s;
    }
    .msg-checkbox .cb-item.checked .cb-box { background: rgba(201,168,76,0.25); }
    .msg-checkbox .cb-confirm {
      margin-top: 4px; padding: 8px 20px; border-radius: 8px;
      border: 1px solid var(--gold); background: transparent;
      color: var(--gold); font-family: 'Noto Serif TC', serif;
      font-size: 13px; letter-spacing: 0.1em; cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s, color 0.2s;
    }
    .msg-checkbox .cb-confirm:hover { background: rgba(201,168,76,0.14); color: var(--cream); }
    .msg-checkbox .cb-confirm:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
    .msg-checkbox.locked .cb-item { pointer-events: none; opacity: 0.5; }

    /* ── Stats panel tab ── */
    .stats-tab {
      position: fixed;
      right: 0; top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 18px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 10px 0 0 10px;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.2em;
      color: var(--gold);
      transition: background 0.2s, color 0.2s;
      user-select: none;
      display: none;
    }
    .stats-tab:hover { background: var(--surface2); color: var(--cream); }
    .stats-tab.visible { display: block; }

    /* ── Students panel tab ── */
    .students-tab {
      position: fixed;
      right: 0; top: calc(50% + 80px);
      transform: translateY(0);
      z-index: 200;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 18px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 10px 0 0 10px;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.2em;
      color: #6aaabf;
      transition: background 0.2s, color 0.2s;
      user-select: none;
      display: none;
    }
    .students-tab:hover { background: var(--surface2); color: #c7e8f5; }
    .students-tab.visible { display: block; }

    /* ── Students panel ── */
    .students-panel {
      position: fixed;
      right: -380px; top: 0; bottom: 0;
      width: var(--panel-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 190;
      display: flex; flex-direction: column;
      transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
    }
    .students-panel.open { right: 0; }

    .students-panel-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .students-panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; letter-spacing: 0.2em; color: #6aaabf;
    }
    .students-panel-close {
      background: transparent; border: none;
      color: var(--muted); font-size: 18px; cursor: pointer;
      line-height: 1; padding: 2px 6px;
      transition: color 0.2s;
    }
    .students-panel-close:hover { color: var(--cream); }

    .students-panel-body {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(201,168,76,0.15) transparent;
      display: flex; flex-direction: column; gap: 8px;
    }
    .students-panel-body::-webkit-scrollbar { width: 3px; }
    .students-panel-body::-webkit-scrollbar-thumb {
      background: rgba(201,168,76,0.15); border-radius: 2px;
    }

    /* ── 學生卡片 ── */
    .student-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
    }
    .student-card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .student-id {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.15em;
      color: #6aaabf;
    }
    .student-score {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.1em;
      color: var(--gold);
    }
    .student-answers {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .ans-cell {
      width: 28px; height: 28px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 400;
      border: 1px solid var(--border);
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.05em;
    }
    .ans-cell.correct { border-color: #6abf69; color: #6abf69; }
    .ans-cell.wrong   { border-color: #bf6a6a; color: #bf6a6a; }

    .students-footer {
      margin-top: 4px; padding: 14px 0 4px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.15em; color: var(--muted);
    }

    /* ── Stats panel ── */
    .stats-panel {
      position: fixed;
      right: -380px; top: 0; bottom: 0;
      width: var(--panel-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 190;
      display: flex; flex-direction: column;
      transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
    }
    .stats-panel.open { right: 0; }

    .stats-panel-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .stats-panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; letter-spacing: 0.2em; color: var(--gold);
    }
    .stats-panel-close {
      background: transparent; border: none;
      color: var(--muted); font-size: 18px; cursor: pointer;
      line-height: 1; padding: 2px 6px;
      transition: color 0.2s;
    }
    .stats-panel-close:hover { color: var(--cream); }

    .stats-panel-body {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(201,168,76,0.15) transparent;
      display: flex; flex-direction: column; gap: 28px;
    }
    .stats-panel-body::-webkit-scrollbar { width: 3px; }
    .stats-panel-body::-webkit-scrollbar-thumb {
      background: rgba(201,168,76,0.15); border-radius: 2px;
    }

    /* ── 每題長條圖區塊 ── */
    .chart-block { display: flex; flex-direction: column; gap: 10px; }
    .chart-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.2em; color: var(--gold-dim);
      text-align: center;
    }
    .chart-wrap { position: relative; width: 100%; height: 160px; }

    /* ── 作答人數 ── */
    .stats-footer {
      margin-top: 4px; padding: 14px 0 4px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.15em; color: var(--muted);
    }

    .msg-link {
      color: #6aaabf;
      text-decoration: underline;
      cursor: pointer;
      font-family: 'Noto Serif TC', serif;
      font-size: 15px; font-weight: 300;
      background: none; border: none; padding: 0;
    }
    .msg-link:hover { color: #c7e8f5; }
    @keyframes msgIn  { to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%         { transform: translateY(-6px); }
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .messages { padding: 14px 10px; }
      .msg { gap: 8px; }
      .avatar { width: 34px; height: 34px; }
      .avatar-name { font-size: 9px; max-width: 38px; }
      .bubble { font-size: 14px; padding: 10px 13px; }
      :root { --panel-w: 280px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-icon">⚠</div>
      <p class="modal-msg" id="modalMsg"></p>
      <button class="modal-close" onclick="closeModal()">確認</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="hd">
      <div class="line"></div><div class="diamond"></div>
    </div>
    <h1>孿生 <span>AI</span></h1>
    <div class="hd r">
      <div class="diamond"></div><div class="line"></div>
    </div>
    <div class="user-badge" id="userBadge"></div>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="empty" id="emptyState">
      <div class="icon">✦</div>
      <p>系統初始化中，請稍候…</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="msgInput" placeholder="輸入訊息…" rows="1" maxlength="2000"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="傳送 (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint"><span id="charCount">0 / 2000</span></div>
  </div>

</div>

<!-- Stats tab & panel（在 .app 外，fixed 定位）-->
<button class="stats-tab" id="statsTab" onclick="togglePanel()">孿生學生作答分析</button>

<button class="students-tab" id="studentsTab" onclick="toggleStudentsPanel()">孿生學生作答記錄</button>

<div class="stats-panel" id="statsPanel">
  <div class="stats-panel-header">
    <span class="stats-panel-title">孿生學生作答分析</span>
    <button class="stats-panel-close" onclick="togglePanel()">✕</button>
  </div>
  <div class="stats-panel-body" id="statsPanelBody"></div>
</div>

<div class="students-panel" id="studentsPanel">
  <div class="students-panel-header">
    <span class="students-panel-title">孿生學生作答記錄</span>
    <button class="students-panel-close" onclick="toggleStudentsPanel()">✕</button>
  </div>
  <div class="students-panel-body" id="studentsPanelBody"></div>
</div>

<script>
  /* ── 設定 ── */
  let BACKEND = 'https://your-tunnel.trycloudflare.com';
  let configLoaded = false;

  async function loadConfig() {
    if (configLoaded) return;
    try {
      const res  = await fetch('./config.json?t=' + Date.now());
      const data = await res.json();
      if (data.backend) {
        BACKEND = data.backend;
        console.log('[config] 後端網址:', BACKEND);
      }
    } catch (e) {
      console.warn('[config] 讀取失敗，使用預設網址:', BACKEND);
    } finally {
      configLoaded = true;
    }
  }

  loadConfig();

  /* ── URL 參數 ── */
  const params    = new URLSearchParams(window.location.search);
  const userName  = params.get('username')   || '使用者';
  const sessionId = params.get('session_id') || '';

  document.getElementById('userBadge').innerHTML = `<strong>${userName}</strong>`;

  /* ── DOM refs ── */
  const msgList   = document.getElementById('messages');
  const emptyEl   = document.getElementById('emptyState');
  const input     = document.getElementById('msgInput');
  const sendBtn   = document.getElementById('sendBtn');
  const charCount = document.getElementById('charCount');

  /* ── Input handlers ── */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 130) + 'px';
    const len = input.value.length;
    charCount.textContent = `${len} / 2000`;
    sendBtn.classList.toggle('active', len > 0);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ── Helpers ── */
  function getTime() {
    return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
  }

  function renderText(text) {
    const parts = text.split(/(__LINK__[^\n]*)/g);
    return parts.map(part => {
      if (part.startsWith('__LINK__')) {
        const raw   = part.replace('__LINK__', '');
        const [filePath, label] = raw.split('||');
        const encodedPath = encodeURIComponent(filePath || '');
        const displayLabel = escHtml(label || 'AnswerMatrix.csv');
        return `<a class="msg-link" href="${BACKEND}/download?path=${encodedPath}" download="${displayLabel}">${displayLabel}</a>`;
      }
      return escHtml(part);
    }).join('');
  }
  function scrollBottom() { msgList.scrollTo({ top: msgList.scrollHeight, behavior: 'smooth' }); }
  function removeEmpty()  { if (emptyEl.parentNode) emptyEl.remove(); }

  /* ── Modal ── */
  function showModal(msg) {
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  /* ── Stats panel ── */
  let panelOpen = false;
  function togglePanel() {
    panelOpen = !panelOpen;
    document.getElementById('statsPanel').classList.toggle('open', panelOpen);
  }

  /* ── Students panel ── */
  let studentsPanelOpen = false;
  function toggleStudentsPanel() {
    studentsPanelOpen = !studentsPanelOpen;
    document.getElementById('studentsPanel').classList.toggle('open', studentsPanelOpen);
  }

  /* ── 圖表顏色 ── */
  const PIE_COLORS = {
    A: 'rgba(201,168,76,0.85)',
    B: 'rgba(106,170,191,0.85)',
    C: 'rgba(106,191,105,0.85)',
    D: 'rgba(191,106,106,0.85)',
  };

  const chartInstances = {};

  /* ── 單輪渲染（que_ana.py 使用）── */
  function renderStudents(students, correct) {
    const body = document.getElementById('studentsPanelBody');
    body.innerHTML = '';
    _appendStudentCards(body, students, correct);

    const footer = document.createElement('div');
    footer.className = 'students-footer';
    const avgScore = students.length
      ? (students.reduce((s, r) => s + r.score, 0) / students.length).toFixed(2)
      : 0;
    footer.textContent = `共 ${students.length} 位學生｜平均得分 ${avgScore}`;
    body.appendChild(footer);

    document.getElementById('studentsTab').classList.add('visible');
  }

  function renderCharts(stats, nStudents) {
    const body = document.getElementById('statsPanelBody');
    body.innerHTML = '';
    Object.values(chartInstances).forEach(c => c.destroy());

    const keys = Object.keys(stats).sort((a, b) =>
      parseInt(a.replace('Q', '')) - parseInt(b.replace('Q', ''))
    );

    keys.forEach((key, idx) => {
      _appendChartBlock(body, key, idx + 1, stats[key], '');
    });

    const footer = document.createElement('div');
    footer.className   = 'stats-footer';
    footer.textContent = `共 ${nStudents} 位孿生學生作答`;
    body.appendChild(footer);

    document.getElementById('statsTab').classList.add('visible');
  }

  /* ── 合併兩輪渲染（true_ending.py 使用）── */
  function renderChartsCombined(r1Stats, r1N, r2Stats, r2N) {
    const body = document.getElementById('statsPanelBody');
    body.innerHTML = '';
    Object.values(chartInstances).forEach(c => c.destroy());

    const keys = Object.keys(r1Stats).sort((a, b) =>
      parseInt(a.replace('Q', '')) - parseInt(b.replace('Q', ''))
    );

    /* ── 第一輪標題 ── */
    const h1 = document.createElement('div');
    h1.className = 'chart-label';
    h1.style.cssText = 'font-size:14px;color:var(--gold);margin-bottom:4px;letter-spacing:0.2em;border-bottom:1px solid var(--border);padding-bottom:6px;';
    h1.textContent = '── 第一輪（修改前）──';
    body.appendChild(h1);

    keys.forEach((key, idx) => {
      _appendChartBlock(body, key, idx + 1, r1Stats[key], 'r1_');
    });

    const footer1 = document.createElement('div');
    footer1.className   = 'stats-footer';
    footer1.textContent = `共 ${r1N} 位孿生學生作答`;
    body.appendChild(footer1);

    /* ── 分隔線 ── */
    const sep = document.createElement('hr');
    sep.style.cssText = 'border:none;border-top:1px solid var(--border);margin:16px 0;';
    body.appendChild(sep);

    /* ── 第二輪標題 ── */
    const h2 = document.createElement('div');
    h2.className = 'chart-label';
    h2.style.cssText = 'font-size:14px;color:#6abf69;margin-bottom:4px;letter-spacing:0.2em;border-bottom:1px solid var(--border);padding-bottom:6px;';
    h2.textContent = '── 第二輪（修改後）──';
    body.appendChild(h2);

    keys.forEach((key, idx) => {
      const r2Counts = r2Stats[key] || { A: 0, B: 0, C: 0, D: 0 };
      _appendChartBlock(body, key, idx + 1, r2Counts, 'r2_');
    });

    const footer2 = document.createElement('div');
    footer2.className   = 'stats-footer';
    footer2.textContent = `共 ${r2N} 位孿生學生作答`;
    body.appendChild(footer2);

    document.getElementById('statsTab').classList.add('visible');
  }

  function renderStudentsCombined(r1Students, r2Students, correct) {
    const body = document.getElementById('studentsPanelBody');
    body.innerHTML = '';

    /* ── 第一輪 ── */
    const h1 = document.createElement('div');
    h1.style.cssText = 'font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:0.2em;color:var(--gold);padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px;';
    h1.textContent = '── 第一輪（修改前）──';
    body.appendChild(h1);

    _appendStudentCards(body, r1Students, correct);

    const avg1 = r1Students.length
      ? (r1Students.reduce((s, r) => s + r.score, 0) / r1Students.length).toFixed(2)
      : 0;
    const f1 = document.createElement('div');
    f1.className   = 'students-footer';
    f1.textContent = `共 ${r1Students.length} 位學生｜平均得分 ${avg1}`;
    body.appendChild(f1);

    /* ── 分隔線 ── */
    const sep = document.createElement('hr');
    sep.style.cssText = 'border:none;border-top:1px solid var(--border);margin:14px 0;';
    body.appendChild(sep);

    /* ── 第二輪 ── */
    const h2 = document.createElement('div');
    h2.style.cssText = 'font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:0.2em;color:#6abf69;padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px;';
    h2.textContent = '── 第二輪（修改後）──';
    body.appendChild(h2);

    _appendStudentCards(body, r2Students, correct);

    const avg2 = r2Students.length
      ? (r2Students.reduce((s, r) => s + r.score, 0) / r2Students.length).toFixed(2)
      : 0;
    const f2 = document.createElement('div');
    f2.className   = 'students-footer';
    f2.textContent = `共 ${r2Students.length} 位學生｜平均得分 ${avg2}`;
    body.appendChild(f2);

    document.getElementById('studentsTab').classList.add('visible');
  }

  /* ── 共用子函數 ── */
  function _appendChartBlock(body, key, qNum, counts, prefix) {
    const labels = Object.keys(counts);
    const values = Object.values(counts);

    const block = document.createElement('div');
    block.className = 'chart-block';

    const lbl = document.createElement('div');
    lbl.className   = 'chart-label';
    lbl.textContent = `第 ${qNum} 題`;
    block.appendChild(lbl);

    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';
    const canvas = document.createElement('canvas');
    canvas.id = `bar_${prefix}${key}`;
    wrap.appendChild(canvas);
    block.appendChild(wrap);
    body.appendChild(block);

    chartInstances[`${prefix}${key}`] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data:            values,
          backgroundColor: labels.map(l => PIE_COLORS[l] || '#888'),
          borderColor:     labels.map(l => PIE_COLORS[l] || '#888'),
          borderWidth: 1, borderRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} 人` } }
        },
        scales: {
          x: {
            ticks: { color: 'rgba(240,235,224,0.6)', font: { size: 13 } },
            grid:  { color: 'rgba(201,168,76,0.08)' },
          },
          y: {
            beginAtZero: true,
            ticks: { color: 'rgba(240,235,224,0.6)', font: { size: 11 }, stepSize: 1, precision: 0 },
            grid:  { color: 'rgba(201,168,76,0.08)' },
          }
        }
      }
    });
  }

  function _appendStudentCards(body, students, correct) {
    students.forEach(s => {
      const card = document.createElement('div');
      card.className = 'student-card';

      const header = document.createElement('div');
      header.className = 'student-card-header';

      const idEl = document.createElement('span');
      idEl.className   = 'student-id';
      idEl.textContent = `學生 #${s.id}`;

      const scoreEl = document.createElement('span');
      scoreEl.className   = 'student-score';
      scoreEl.textContent = `${s.score} / ${s.answers.length} 分`;

      header.appendChild(idEl);
      header.appendChild(scoreEl);

      const answersEl = document.createElement('div');
      answersEl.className = 'student-answers';

      s.answers.forEach((ans, i) => {
        const cell = document.createElement('div');
        const isCorrect = correct && ans === correct[i];
        cell.className   = `ans-cell ${isCorrect ? 'correct' : 'wrong'}`;
        cell.textContent = ans;
        cell.title       = `Q${i + 1}`;
        answersEl.appendChild(cell);
      });

      card.appendChild(header);
      card.appendChild(answersEl);
      body.appendChild(card);
    });
  }

  /* ── Append message ── */
  function appendMsg(text, role) {
    removeEmpty();
    const label = role === 'user' ? userName : '艾評';

    const isButton   = text.startsWith('__BUTTON__') && !text.startsWith('__BUTTONS__');
    const isButtons  = text.startsWith('__BUTTONS__');
    const isDropdown = text.startsWith('__DROPDOWN__');
    const isCheckbox = text.startsWith('__CHECKBOX__');
    const isData     = text.startsWith('__DATA__');
    const isHtml     = text.startsWith('__HTML__');
    const isPanel    = text.startsWith('__PANEL__');
    let content = '';

    if (isPanel) return;
    if (isCheckbox) {
      const raw    = text.replace('__CHECKBOX__', '');
      const parts  = raw.split('||');
      const cbId   = parts[0] || 'cb';
      const maxSel = parseInt(parts[1]) || 2;
      const opts   = parts.slice(2);
      const items  = opts.map((o, i) => `
        <label class="cb-item" id="cbitem_${cbId}_${i}" onclick="toggleCb('${cbId}',${i},${maxSel})">
          <div class="cb-box" id="cbbox_${cbId}_${i}"></div>
          <span>${escHtml(o)}</span>
        </label>`).join('');
      content = `<div class="msg-checkbox" id="cbwrap_${cbId}">
        ${items}
        <button class="cb-confirm" id="cbconfirm_${cbId}" disabled
          onclick="confirmCb('${cbId}','${opts.join('||')}')">確認（已選 <span id="cbcount_${cbId}">0</span>/${maxSel}）</button>
      </div>`;
    } else if (isData) {
      try {
        const payload = JSON.parse(text.replace('__DATA__', ''));
        if (payload.type === 'answer_matrix') {
          renderCharts(payload.stats, payload.n_students);
          if (payload.students && payload.students.length > 0) {
            renderStudents(payload.students, payload.correct || []);
          }
        } else if (payload.type === 'pd_report') {
          // PD 報告顯示摘要
          console.log('[pd_report]', payload);
          const n = Object.keys(payload.items || {}).length;
        } else if (payload.type === 'que_log') {
          // 題庫報告顯示摘要
          console.log('[que_log]', payload);
          const n = Object.keys(payload.questions || {}).length;
        } else if (payload.type === 'answer_matrix_combined') {
          renderChartsCombined(
            payload.round1.stats, payload.round1.n_students,
            payload.round2.stats, payload.round2.n_students,
          );
          renderStudentsCombined(
            payload.round1.students,
            payload.round2.students,
            payload.correct || [],
          );
        }
      } catch(e) { console.warn('[data parse]', e); }
      return;
    } else if (isHtml) {
      content = `<div class="bubble html-bubble">${text.slice(8)}</div>`;
    } else if (isDropdown) {
      const raw         = text.replace('__DROPDOWN__', '');
      const parts       = raw.split('||');
      const ddId        = parts[0] || 'dropdown';
      const placeholder = parts[1] || '請選擇…';
      const options     = parts.slice(2);
      const opts        = options.map(o =>
        `<option value="${escHtml(o)}">${escHtml(o)}</option>`
      ).join('');
      content = `<div class="msg-dropdown" id="ddwrap_${ddId}">
        <select id="sel_${ddId}">
          <option value="" disabled selected>${placeholder}</option>
          ${opts}
        </select>
        <button class="dd-confirm" onclick="confirmDropdown('${ddId}')">確認</button>
      </div>`;
    } else if (isButtons) {
      const groupId = 'grp_' + Date.now();
      const parts   = text.replace('__BUTTONS__', '').split(';');
      const btns    = parts.map(p => {
        const [lbl, col, sz, bid] = p.split('||');
        return `<button class="btn-bubble ${col||'gold'} ${sz||'medium'}"
          data-group="${groupId}"
          onclick="clickBtn(this,'${(lbl||'').replace(/'/g,"\\'")}','${(bid||lbl||'').replace(/'/g,"\\'")}','${groupId}')">
          ${escHtml(lbl||'')}
        </button>`;
      }).join('');
      content = `<div class="btn-row" data-group="${groupId}">${btns}</div>`;
    } else if (isButton) {
      const [lbl, col, sz, bid] = text.replace('__BUTTON__','').split('||');
      content = `<div class="btn-row">
        <button class="btn-bubble ${col||'gold'} ${sz||'medium'}"
          onclick="clickBtn(this,'${(lbl||'').replace(/'/g,"\\'")}','${(bid||lbl||'').replace(/'/g,"\\'")}')">
          ${escHtml(lbl||'')}
        </button>
      </div>`;
    } else {
      content = `<div class="bubble">${renderText(text)}</div>`;
    }

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar-col">
        <div class="avatar">${role === 'ai'
          ? '<img src="head.jpg" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'
          : '<img src="user-head.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'}</div>
        <span class="avatar-name">${label}</span>
      </div>
      <div class="msg-body">
        ${content}
        <div class="msg-time">${getTime()}</div>
      </div>`;
    msgList.appendChild(div);
    scrollBottom();
    return div;
  }

  /* ── Typing bubble ── */
  let typingBubble = null;
  function appendTyping() {
    removeEmpty();
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.innerHTML = `
      <div class="avatar-col">
        <div class="avatar"><img src="head.jpg" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"></div>
        <span class="avatar-name">艾評</span>
      </div>
      <div class="msg-body">
        <div class="bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    msgList.appendChild(div);
    scrollBottom();
    return div;
  }
  function removeTyping() {
    if (typingBubble) { typingBubble.remove(); typingBubble = null; }
  }

  /* ── Checkbox 多選 ── */
  const _cbSelected = {};

  function toggleCb(cbId, idx, maxSel) {
    if (!_cbSelected[cbId]) _cbSelected[cbId] = new Set();
    const sel  = _cbSelected[cbId];
    const item = document.getElementById(`cbitem_${cbId}_${idx}`);
    const box  = document.getElementById(`cbbox_${cbId}_${idx}`);

    if (sel.has(idx)) {
      sel.delete(idx);
      item.classList.remove('checked');
      box.textContent = '';
    } else {
      if (sel.size >= maxSel) return;
      sel.add(idx);
      item.classList.add('checked');
      box.textContent = '✓';
    }

    const count = sel.size;
    document.getElementById(`cbcount_${cbId}`).textContent = count;
    const btn = document.getElementById(`cbconfirm_${cbId}`);
    btn.disabled = (count !== maxSel);
  }

  function confirmCb(cbId, optsRaw) {
    const sel    = _cbSelected[cbId] || new Set();
    const opts   = optsRaw.split('||');
    const chosen = [...sel].sort().map(i => opts[i]);

    const wrap = document.getElementById(`cbwrap_${cbId}`);
    wrap.classList.add('locked');
    document.getElementById(`cbconfirm_${cbId}`).disabled = true;

    const msg = chosen.join('，');
    appendMsg(msg, 'user');
    logMsg('user', msg);

    post('/button_click', {
      message: `cb_first:${chosen[0]}`, username: userName, session_id: sessionId,
    });
    setTimeout(() => {
      post('/button_click', {
        message: `cb_second:${chosen[1]}`, username: userName, session_id: sessionId,
      });
    }, 1000);
  }

  function confirmDropdown(ddId) {
    const sel = document.getElementById(`sel_${ddId}`);
    const val = sel ? sel.value : '';
    if (!val) return;
    sel.disabled = true;
    const btn = document.querySelector(`#ddwrap_${ddId} .dd-confirm`);
    if (btn) { btn.disabled = true; btn.textContent = '✓ 已選擇'; }
    appendMsg(val, 'user');
    logMsg('user', val);
    post('/button_click', { message: val, username: userName, session_id: sessionId });
  }

  function clickBtn(btn, label, buttonId, groupId) {
    if (groupId) {
      document.querySelectorAll(`[data-group="${groupId}"]`)
        .forEach(b => b.classList.add('used'));
    } else {
      btn.classList.add('used');
    }
    btn.textContent = '✓ ' + label;

    if (buttonId === 'btn_goto_enter') {
      window.location.href = 'enter.html';
      return;
    }

    appendMsg(label, 'user');
    logMsg('user', `[按鈕:${buttonId}] ${label}`);
    post('/button_click', { message: `${buttonId}:${label}`, username: userName, session_id: sessionId });
  }

  async function post(path, body) {
    try {
      await fetch(`${BACKEND}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch(e) { console.warn(`[post ${path}]`, e.message); }
  }

  let userJustActed = false;
  function markUserActed() {
    userJustActed = true;
    setTimeout(() => { userJustActed = false; }, 1500);
  }

  function logMsg(role, message) {
    const now = new Date();
    const ts  = now.getFullYear()
      + '-' + String(now.getMonth() + 1).padStart(2, '0')
      + '-' + String(now.getDate()).padStart(2, '0')
      + ' ' + String(now.getHours()).padStart(2, '0')
      + ':' + String(now.getMinutes()).padStart(2, '0')
      + ':' + String(now.getSeconds()).padStart(2, '0');
    post('/log', { username: userName, session_id: sessionId, role, message, timestamp: ts });
  }

  if (!sessionId) { window.location.href = 'enter.html'; }

  /* ── Poll（每 1000ms）── */
  setInterval(async () => {
    if (!sessionId) return;
    try {
      const res  = await fetch(`${BACKEND}/poll?session_id=${encodeURIComponent(sessionId)}`);
      const data = await res.json();

      if (data.message) {
        removeTyping();
        if (data.message.startsWith('__ALERT__')) {
          const alertText = data.message.replace('__ALERT__', '');
          showModal(alertText);
          logMsg('ai', `[ALERT] ${alertText}`);
        } else if (data.message.startsWith('__DATA__')) {
          appendMsg(data.message, 'ai');
        } else if (data.message.startsWith('__PANEL__')) {
          const target = data.message.replace('__PANEL__', '').trim();
          if (target === 'stats' && !panelOpen) togglePanel();
          else if (target === 'students' && !studentsPanelOpen) toggleStudentsPanel();
          else if (target === 'stats_close' && panelOpen) togglePanel();
          else if (target === 'students_close' && studentsPanelOpen) toggleStudentsPanel();
        } else if (data.message.startsWith('__HTML__')) {
          appendMsg(data.message, 'ai');
          logMsg('ai', '[HTML TABLE]');
        } else {
          appendMsg(data.message, 'ai');
          logMsg('ai', data.message);
        }
      } else if (data.thinking) {
        if (!typingBubble) typingBubble = appendTyping();
      } else if (!data.thinking && typingBubble) {
        removeTyping();
      }

      const locked = data.input_locked === true;
      input.disabled    = locked;
      sendBtn.disabled  = locked;
      input.placeholder = locked ? '請點擊上方按鈕作答…' : '輸入訊息…';
    } catch(e) { console.warn('[poll]', e.message); }
  }, 1000);

  /* ── Greeting ── */
  window.addEventListener('load', async () => {
    await loadConfig();
    typingBubble = appendTyping();
    const mode  = params.get('mode') || '';
    const route = mode === 'set_que'     ? '/greeting_set_que'
                : mode === 'admin'       ? '/greeting_admin'
                : mode === 'true_ending' ? '/greeting_true_ending'
                : '/greeting';
    try {
      const oldLogPath = params.get('old_log_path') || '';
      const res = await post_r(route, { username: userName, session_id: sessionId, old_log_path: oldLogPath });
      const data = await res.json();
      removeTyping();
      const reply = data.reply || '> 系統初始化失敗，請聯絡助教（u11301126@go.utaipei.edu.tw）。)';
      appendMsg(reply, 'ai');
      logMsg('ai', reply);
    } catch(e) {
      removeTyping();
      const fallback = '> 系統初始化失敗，請聯絡助教（u11301126@go.utaipei.edu.tw）。)';
      appendMsg(fallback, 'ai');
      logMsg('ai', fallback);
    }
  });

  async function post_r(path, body) {
    return fetch(`${BACKEND}${path}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  }

  /* ── Send message ── */
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    appendMsg(text, 'user');
    logMsg('user', text);
    input.value = '';
    input.style.height = 'auto';
    charCount.textContent = '0 / 2000';
    sendBtn.classList.remove('active');
    await post('/chat', { message: text, username: userName, session_id: sessionId });
  }
</script>

</body>
