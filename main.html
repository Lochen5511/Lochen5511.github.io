<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI 共學</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #13110e;
      --surface:   #1c1814;
      --surface2:  #242018;
      --border:    rgba(201,168,76,0.18);
      --gold:      #c9a84c;
      --gold-dim:  rgba(201,168,76,0.55);
      --cream:     #f0ebe0;
      --muted:     rgba(240,235,224,0.38);
      --user-bg:   #2a2318;
      --ai-bg:     #1c1814;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Noto Serif TC', serif;
      color: var(--cream);
      overflow: hidden;
    }

    /* ── 整體佈局 ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }

    /* ── 頂部 Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      flex-shrink: 0;
      gap: 14px;
      opacity: 0;
      animation: fadeDown 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
    }

    .header-deco {
      display: flex; align-items: center; gap: 8px;
    }
    .header-deco .line {
      width: 36px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }
    .header-deco.right .line {
      background: linear-gradient(to left, transparent, var(--gold-dim));
    }
    .header-deco .diamond {
      width: 5px; height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.7;
    }

    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: var(--cream);
    }
    header h1 span {
      color: var(--gold);
    }

    /* 右上角用戶名 */
    .user-badge {
      position: absolute;
      right: 24px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .user-badge strong {
      color: var(--gold-dim);
      font-weight: 400;
    }

    /* ── 訊息區域 ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(201,168,76,0.2) transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(201,168,76,0.2);
      border-radius: 2px;
    }

    /* 空狀態提示 */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.5s forwards;
    }
    .empty-state .icon {
      width: 48px; height: 48px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      color: var(--gold-dim);
    }
    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    /* ── 訊息泡泡 ── */
    .msg {
      display: flex;
      gap: 12px;
      opacity: 0;
      transform: translateY(10px);
      animation: msgIn 0.35s ease forwards;
      align-items: flex-start;
      width: 100%;
    }
    .msg.user { flex-direction: row-reverse; }

    /* 頭像欄：名字 + 圓圈，靠頂對齊 */
    .avatar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      padding-top: 0;
    }
    .avatar-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-align: center;
      max-width: 56px;
      word-break: break-all;
      line-height: 1.3;
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      font-family: 'Noto Serif TC', serif;
    }
    .msg.ai .avatar {
      background: var(--surface2);
      color: var(--gold);
    }
    .msg.user .avatar {
      background: var(--user-bg);
      color: var(--cream);
    }

    /* 泡泡欄，靠頂對齊 */
    .msg-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      padding-top: 0;
    }
    .msg.user .msg-body { align-items: flex-end; }

    .bubble {
      padding: 13px 18px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.02em;
      word-break: break-word;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      width: fit-content;
      max-width: 100%;
    }
    .msg.ai .bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--cream);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(201,168,76,0.22);
      border-top-right-radius: 4px;
      color: var(--cream);
    }

    /* 手機端響應式 */
    @media (max-width: 600px) {
      .messages { padding: 16px 10px; }
      .msg { gap: 8px; }
      .avatar { width: 36px; height: 36px; font-size: 11px; }
      .avatar-name { font-size: 10px; max-width: 40px; }
      .bubble { font-size: 14px; padding: 10px 14px; }
    }

    /* 並排按鈕列 */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    /* 按鈕氣泡 */
    .btn-bubble {
      display: inline-block;
      margin-top: 6px;
      border-radius: 8px;
      background: transparent;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      border: 1px solid;
    }
    .btn-bubble:active { transform: scale(0.97); }
    .btn-bubble.used {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    /* 大小 */
    .btn-bubble.small  { padding: 6px 16px;  font-size: 12px; }
    .btn-bubble.medium { padding: 10px 28px; font-size: 14px; }
    .btn-bubble.large  { padding: 14px 40px; font-size: 17px; }

    /* 顏色 */
    .btn-bubble.gold  { border-color: var(--gold);  color: var(--gold-light); }
    .btn-bubble.gold:hover  { background: rgba(201,168,76,0.15); color: var(--cream); }
    .btn-bubble.green { border-color: #6abf69; color: #6abf69; }
    .btn-bubble.green:hover { background: rgba(106,191,105,0.15); color: #c8f5c7; }
    .btn-bubble.blue  { border-color: #6aaabf; color: #6aaabf; }
    .btn-bubble.blue:hover  { background: rgba(106,170,191,0.15); color: #c7e8f5; }
    .btn-bubble.red   { border-color: #bf6a6a; color: #bf6a6a; }
    .btn-bubble.red:hover   { background: rgba(191,106,106,0.15); color: #f5c7c7; }
    .btn-bubble.gray  { border-color: #888; color: #aaa; }
    .btn-bubble.gray:hover  { background: rgba(136,136,136,0.15); color: #ddd; }

    .msg.user .msg-time { text-align: right; }

    /* 打字動畫（正在輸入氣泡） */
    .typing-indicator {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 18px;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--gold-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    /* ── 底部輸入區 ── */
    .input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      opacity: 0;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px 10px 18px;
      transition: border-color 0.3s ease;
    }
    .input-row:focus-within {
      border-color: rgba(201,168,76,0.45);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Noto Serif TC', serif;
      font-size: 15px;
      font-weight: 300;
      color: var(--cream);
      line-height: 1.6;
      max-height: 140px;
      min-height: 26px;
      caret-color: var(--gold);
      scrollbar-width: none;
    }
    textarea::placeholder {
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
    }
    textarea::-webkit-scrollbar { display: none; }

    /* 傳送按鈕 */
    .btn-send {
      width: 40px; height: 40px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    .btn-send svg {
      width: 18px; height: 18px;
      transition: transform 0.2s ease;
    }
    .btn-send.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--bg);
    }
    .btn-send.active:hover {
      background: #d4b460;
      transform: scale(1.05);
    }
    .btn-send.active:hover svg {
      transform: translateX(2px) translateY(-2px);
    }
    .btn-send.active:active {
      transform: scale(0.96);
    }

    /* 字數提示 */
    .input-hint {
      display: flex;
      justify-content: flex-end;
      margin-top: 7px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      opacity: 0.6;
    }

    /* ── 彈出視窗 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.25s ease;
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      animation: scaleIn 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .modal-icon {
      font-size: 28px;
      margin-bottom: 14px;
    }
    .modal-msg {
      font-family: 'Noto Serif TC', serif;
      font-size: 15px;
      font-weight: 300;
      color: var(--cream);
      line-height: 1.8;
      letter-spacing: 0.04em;
      margin-bottom: 28px;
    }
    .modal-close {
      padding: 10px 32px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      background: transparent;
      color: var(--gold-light);
      font-family: 'Noto Serif TC', serif;
      font-size: 13px;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover {
      background: rgba(201,168,76,0.15);
      color: var(--cream);
    }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ── 動畫 ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes msgIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- 彈出視窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-icon">⚠</div>
      <p class="modal-msg" id="modalMsg"></p>
      <button class="modal-close" onclick="closeModal()">確認</button>
    </div>
  </div>

  <!-- 頂部 -->
  <header>
    <div class="header-deco">
      <div class="line"></div>
      <div class="diamond"></div>
    </div>
    <h1><span>AI</span> 共學</h1>
    <div class="header-deco right">
      <div class="diamond"></div>
      <div class="line"></div>
    </div>
    <div class="user-badge" id="userBadge"></div>
  </header>

  <!-- 訊息列表 -->
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">✦</div>
      <p>有什麼想學的？請開始提問</p>
    </div>
  </div>

  <!-- 底部輸入區 -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="msgInput"
        placeholder="輸入訊息…"
        rows="1"
        maxlength="2000"
      ></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="傳送 (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">
      <span id="charCount">0 / 2000</span>
    </div>
  </div>

</div>

<script>
  // 取得使用者名稱
  const userName = sessionStorage.getItem('userName') || '使用者';
  const badge = document.getElementById('userBadge');
  if (userName) badge.innerHTML = `<strong>${userName}</strong>`;

  const input   = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const msgList = document.getElementById('messages');
  const empty   = document.getElementById('emptyState');
  const charCount = document.getElementById('charCount');

  // 自動調整 textarea 高度
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    const len = input.value.length;
    charCount.textContent = `${len} / 2000`;
    sendBtn.classList.toggle('active', len > 0);
  });

  // Enter 傳送（Shift+Enter 換行）
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function getTime() {
    return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  }

  function appendMsg(text, role) {
    if (empty.parentNode) empty.remove();

    const label = role === 'user' ? (userName || 'U') : 'AI';

    // 判斷是否為按鈕訊息
    const isButton  = text.startsWith('__BUTTON__') && !text.startsWith('__BUTTONS__');
    const isButtons = text.startsWith('__BUTTONS__');
    let contentHtml = '';

    if (isButtons) {
      // 多按鈕並排，加上同一個 group-id 讓點擊時整組失效
      const groupId = 'btngroup_' + Date.now();
      const parts = text.replace('__BUTTONS__', '').split(';');
      const btns = parts.map(p => {
        const [btnLabel, btnColor, btnSize, btnId] = p.split('||');
        return `<button class="btn-bubble ${btnColor||'gold'} ${btnSize||'medium'}"
          data-group="${groupId}"
          onclick="clickButton(this, '${(btnLabel||'').replace(/'/g,"\\'")}', '${(btnId||btnLabel||'').replace(/'/g,"\\'")}', '${groupId}')">
          ${escHtml(btnLabel||'')}
        </button>`;
      }).join('');
      contentHtml = `<div class="btn-row" data-group="${groupId}">${btns}</div>`;
    } else if (isButton) {
      const parts    = text.replace('__BUTTON__', '').split('||');
      const btnLabel = parts[0] || '';
      const btnColor = parts[1] || 'gold';
      const btnSize  = parts[2] || 'medium';
      const btnId    = parts[3] || btnLabel;
      contentHtml = `<button class="btn-bubble ${btnColor} ${btnSize}" onclick="clickButton(this, '${btnLabel.replace(/'/g,"\\'")}', '${btnId.replace(/'/g,"\\'")}')">
        ${escHtml(btnLabel)}
      </button>`;
    } else {
      contentHtml = `<div class="bubble">${escHtml(text)}</div>`;
    }

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    div.innerHTML = `
      <div class="avatar-col">
        <div class="avatar">${role === 'ai' ? 'AI' : ''}</div>
        <span class="avatar-name">${label}</span>
      </div>
      <div class="msg-body">
        ${contentHtml}
        <div class="msg-time">${getTime()}</div>
      </div>
    `;
    msgList.appendChild(div);
    scrollBottom();
    return div;
  }

  function clickButton(btn, label, buttonId, groupId) {
    // 若有 groupId，整組按鈕都失效
    if (groupId) {
      document.querySelectorAll(`[data-group="${groupId}"]`).forEach(b => {
        b.classList.add('used');
      });
    } else {
      btn.classList.add('used');
    }
    btn.textContent = '✓ ' + label;

    // 顯示用戶點擊紀錄
    appendMsg(label, 'user');

    // 立即顯示思考動畫
    if (thinkingBubble) { thinkingBubble.remove(); }
    thinkingBubble = appendTyping();

    // 記錄至 log
    logMessage('user', `[按鈕:${buttonId}] ${label}`);

    // 送至後端
    fetch('https://lochen-test.loca.lt/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message:    `${buttonId}:${label}`,
        username:   userName,
        session_id: sessionId,
        log_path:   sessionStorage.getItem('logPath') || ''
      })
    }).catch(e => console.warn(e));
  }

  function appendTyping() {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar-col">
        <div class="avatar">AI</div>
        <span class="avatar-name">AI</span>
      </div>
      <div class="msg-body">
        <div class="bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    msgList.appendChild(div);
    scrollBottom();
    return div;
  }

  function scrollBottom() {
    msgList.scrollTo({ top: msgList.scrollHeight, behavior: 'smooth' });
  }

  const sessionId = sessionStorage.getItem('sessionId') || '';

  function showModal(msg) {
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  let thinkingBubble = null;

  // 每秒輪詢一次，取出 button.py 推送的訊息
  setInterval(async () => {
    try {
      const res = await fetch(`https://lochen-test.loca.lt/poll?session_id=${encodeURIComponent(sessionId)}`);
      const data = await res.json();

      if (data.message) {
        thinkingBubble && (thinkingBubble.remove(), thinkingBubble = null);
        if (data.message.startsWith('__ALERT__')) {
          showModal(data.message.replace('__ALERT__', ''));
        } else {
          appendMsg(data.message, 'ai');
          logMessage('ai', data.message);
        }
      } else if (data.thinking && !thinkingBubble) {
        // 開始思考：顯示思考氣泡
        thinkingBubble = appendTyping();
      } else if (!data.thinking && thinkingBubble) {
        // 停止思考：移除氣泡
        thinkingBubble.remove(); thinkingBubble = null;
      }
    } catch (e) {
      // 後端未啟動時靜默忽略
    }
  }, 1000);

  // 記錄訊息至本地 txt 檔
  async function logMessage(role, message) {
    try {
      await fetch('https://lochen-test.loca.lt/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: userName, session_id: sessionId, role, message })
      });
    } catch (e) {
      console.warn('Log 記錄失敗:', e);
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/\n/g,'<br>');
  }

  // 頁面載入後自動觸發 AI 第一句問候
  window.addEventListener('load', async () => {
    const typing = appendTyping();
    try {
      const res = await fetch('https://lochen-test.loca.lt/greeting', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: userName, session_id: sessionId })
      });
      const data = await res.json();
      typing.remove();
      appendMsg(data.reply || '> 系統初始化中。\n(若在3分鐘內，未跳出下一步訊息，請重新開啟頁面。刷新未生效時，請通知助教)', 'ai');
      logMessage('ai', data.reply || '> 系統初始化中。\n(若在3分鐘內，未跳出下一步訊息，請重新開啟頁面。刷新未生效時，請通知助教)');
    } catch (err) {
      typing.remove();
      appendMsg('> 系統初始化中。\n(若在3分鐘內，未跳出下一步訊息，請重新開啟頁面。刷新未生效時，請通知助教)', 'ai');
      logMessage('ai', '> 系統初始化中。\n(若在3分鐘內，未跳出下一步訊息，請重新開啟頁面。刷新未生效時，請通知助教)');
    }
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // 顯示用戶訊息
    appendMsg(text, 'user');
    logMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    charCount.textContent = '0 / 2000';
    sendBtn.classList.remove('active');

    try {
      await fetch('https://lochen-test.loca.lt/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message:    text,
          username:   userName,
          session_id: sessionId,
          log_path:   sessionStorage.getItem('logPath') || ''
        })
      });
      // AI 的回應由 button.py 透過 /push → /poll 機制送出，不在這裡處理
    } catch (err) {
      appendMsg('⚠ 無法連接本地伺服器，請確認 Python 後端是否執行中。', 'ai');
    }
  }
</script>
